name: CANN build (self-hosted Ascend)
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
      - '.github/workflows/main.yml'
jobs:
  build:
    runs-on: [self-hosted, Linux, ARM64, ascend]
    steps:
      - uses: actions/checkout@v4
      - name: Build against installed CANN
        shell: bash
        run: |
          set -euo pipefail
          source /usr/local/Ascend/ascend-toolkit/latest/set_env.sh
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j4
